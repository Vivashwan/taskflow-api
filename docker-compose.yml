services:
  web:
    build: .
    command: /entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"  # Internal, not published to host
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"      # Celery broker + Django cache

  celery:
    build: .
    command: celery -A taskflow_api worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0

  celery-beat:
    build: .
    command: celery -A taskflow_api beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0

volumes:
  static_volume:
